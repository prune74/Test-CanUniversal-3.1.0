; ============================================================================
;  Test CanUniversal v3.1.0 — ESP32 + PlatformIO
;  Test du CAN interne (TWAI) en mode loopback : aucun câblage nécessaire.
; ============================================================================

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps = 
    prune74/CanUniversal@^3.1.0